[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-studio"
version = "1.3.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gui = ["PySide6==6.10.2", "Pillow>=13,<14", "pyserial>=3.5,<4"]
vision = ["mss==10.2.0", "opencv-python-headless==5.0.0.93"]
hid = ["pyserial>=3.5,<4"]
build = ["PyInstaller==6.22.3"]

[project.scripts]
macro-studio = "macro_studio.__main__:main"
macro-studio-editor = "macro_studio.gui:main"

[tool.setuptools.package-data]
macro_studio = ["editor/*", "editor/msg/*", "editor/media/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
